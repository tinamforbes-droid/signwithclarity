# netlify.toml
#
# If you DON'T already have a netlify.toml in your repo, just put this file
# in the root of your "signwithclarity" repo, next to package.json.
#
# If you ALREADY have a netlify.toml (some project templates create one
# automatically), don't replace it — just add the [functions] block below
# into your existing file, keeping your existing [build] settings as they are.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# A photo page can take longer than the default 10 seconds.
# 26 seconds is the longest a synchronous function is allowed to run.
[functions."decode"]
  timeout = 26

# Once a day, read one value from the Supabase accounts table.
# Supabase looks at the past week and expects database requests on
# those days. A check every two or three days can still look too quiet.
# This function has no public address. 15:17 UTC is morning in Canada.
[functions."supabase-keep-alive"]
  schedule = "17 15 * * *"

# Privacy Policy and Terms of Use are routes in the same app.
# Netlify serves existing files first, then this rewrite, so the
# decode function and built assets are left alone.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
